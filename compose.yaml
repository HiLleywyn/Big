services:
  big:
    build: .
    image: big:local
    restart: unless-stopped
    init: true
    env_file:
      - path: .env
        required: false
    volumes:
      - big-data:/app/data
    read_only: true
    tmpfs:
      - /tmp:size=16m,noexec,nosuid
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true

volumes:
  big-data:

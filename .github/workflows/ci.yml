name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
      - run: python -m pip install --upgrade pip "setuptools>=83"
      - run: python -m pip install -e ".[dev]" build
      - run: ruff check .
      - run: ruff format --check .
      - run: mypy src
      - run: pytest --cov=bigbot --cov-report=term-missing --cov-fail-under=80
      - run: pip-audit
      - run: python -m build

  container:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - run: docker compose -f docker-compose.yml config --quiet
      - run: docker build --tag big:test .
      - run: >-
          docker run --detach --name big-ci
          --publish 127.0.0.1:8787:8787
          --env BIG_DRY_RUN=true
          --env BIG_DATABASE_PATH=/tmp/big.db
          big:test
      - name: Verify container readiness
        run: |
          for attempt in {1..20}; do
            if curl --fail --silent http://127.0.0.1:8787/readyz; then
              exit 0
            fi
            sleep 1
          done
          docker logs big-ci
          exit 1
      - if: always()
        run: docker rm --force big-ci || true

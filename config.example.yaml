# Discord IDs are integers. A feed can override forum_channel_id when needed.
guild_id: 123456789012345678
forum_channel_id: 123456789012345678
polling_interval_seconds: 900

clustering:
  threshold: 0.68
  window_hours: 72
  stale_after_hours: 96
  automatic_management: true
  merge_threshold: 0.82
  split_threshold: 0.45
  maintenance_interval_seconds: 1800
  maintenance_batch_size: 50

update_behavior:
  post_major_updates: true
  post_source_updates: false

retention:
  # Off by default. Set to a positive number to clear old forum threads.
  clear_after_days:
  # archive keeps the thread history. delete removes the forum thread.
  action: archive
  batch_size: 25

# Big includes a carefully bounded 20-tag classifier. Entries here extend those rules.
tag_mappings:
  Markets: [treasury auction, wall street]
  Economy: [consumer price index, nonfarm payrolls]
  Technology: [quantum computing]
  Crypto: [digital asset]

source_priorities:
  Federal Reserve: 100
  SEC: 100
  NASA: 100
  PBS News: 95
  BBC News: 95
  ProPublica: 92
  Ars Technica: 90
  UN News: 90

feeds:
  - name: PBS News Headlines
    publisher: PBS News
    url: https://www.pbs.org/newshour/feeds/rss/headlines
    summarization_enabled: true
    default_tags: [United States]
    interval_seconds: 900
  - name: BBC World
    publisher: BBC News
    url: https://feeds.bbci.co.uk/news/world/rss.xml
    summarization_enabled: true
    default_tags: [World]
    interval_seconds: 900
  - name: Federal Reserve Press Releases
    publisher: Federal Reserve
    url: https://www.federalreserve.gov/feeds/press_all.xml
    summarization_enabled: true
    default_tags: [Economy, Markets]
    interval_seconds: 1800
  - name: SEC Press Releases
    publisher: SEC
    url: https://www.sec.gov/news/pressreleases.rss
    summarization_enabled: true
    default_tags: [Markets, Law]
    interval_seconds: 1800
  - name: ProPublica
    publisher: ProPublica
    url: https://www.propublica.org/feeds/propublica/main
    summarization_enabled: true
    default_tags: [United States]
    interval_seconds: 1800
  - name: Ars Technica
    publisher: Ars Technica
    url: https://feeds.arstechnica.com/arstechnica/index
    summarization_enabled: true
    default_tags: [Technology]
    interval_seconds: 1800
  - name: NASA News Releases
    publisher: NASA
    url: https://www.nasa.gov/news-release/feed/
    summarization_enabled: false
    default_tags: [Science]
    interval_seconds: 3600
  - name: UN News
    publisher: UN News
    url: https://news.un.org/feed/subscribe/en/news/all/rss.xml
    summarization_enabled: true
    default_tags: [World]
    interval_seconds: 1800
